name: Web bring-up

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rpcs3-web-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      BASE_PATH: /rpcs3-web/
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache
      - run: yarn install --immutable
      - run: yarn build:core
      - run: yarn test
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy experimental test page
        id: deployment
        uses: actions/deploy-pages@v4
