<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>RPCS3 Web</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: #000; color: #e8ecf4;
        overflow: hidden; overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
      }
      /* The output fills the display: a game is the whole screen, not a panel. Its backing store is
         sized to the display's own bounds, so filling does not distort. */
      #gpu-output { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; display: block; background: #000; }

      /* Overlays sit above the output and never take pointer events unless they are controls */
      #hud {
        position: fixed; top: max(6px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
        display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
        padding: 5px 9px; border-radius: 7px; background: rgba(6, 9, 14, .58);
        font-size: 12px; line-height: 1.35; pointer-events: none; z-index: 3;
      }
      #status { color: #92f3b4; font-weight: 600; font-variant-numeric: tabular-nums; }
      #detail { color: #9da8bb; font-size: 10px; max-width: min(62vw, 620px); text-align: right; }
      #export-trace {
        position: fixed; top: max(6px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
        z-index: 3; padding: 6px 10px; border-radius: 999px; opacity: .5;
        border: 1px solid #526078; background: rgba(6, 9, 14, .58); color: #fff; font: 600 11px inherit;
      }

      .controls {
        position: fixed; inset: auto 0 max(10px, env(safe-area-inset-bottom)) 0;
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
        gap: 14px; padding: 0 max(12px, env(safe-area-inset-left)) 0 max(12px, env(safe-area-inset-right));
        z-index: 2; touch-action: none;
      }
      .dpad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); justify-content: start; }
      .faces { position: relative; justify-self: end; width: 172px; height: 146px; }
      button { border: 1px solid rgba(140, 160, 200, .5); background: rgba(20, 26, 38, .5); color: #fff; font: 600 15px inherit; touch-action: none; }
      button.pressed, button:active { background: #4968ff; border-color: #90a4ff; }
      .dpad button { border-radius: 9px; }
      [data-control="up"] { grid-column: 2; grid-row: 1; }
      [data-control="left"] { grid-column: 1; grid-row: 2; }
      [data-control="right"] { grid-column: 3; grid-row: 2; }
      [data-control="down"] { grid-column: 2; grid-row: 3; }
      .start { align-self: end; margin-bottom: 12px; border-radius: 999px; padding: 11px 16px; font-size: 11px; }
      .faces button { position: absolute; width: 56px; height: 56px; border-radius: 50%; }
      [data-control="triangle"] { left: 58px; top: 0; }
      [data-control="square"] { left: 0; top: 45px; }
      [data-control="circle"] { right: 0; top: 45px; }
      [data-control="cross"] { left: 58px; bottom: 0; }

      /* A real controller is the better input, so the on-screen pad gets out of the picture */
      body.has-gamepad .controls { display: none; }
    </style>
  </head>
  <body>
    <canvas id="gpu-output" width="768" height="432" aria-label="Live RPCS3 WebGPU output"></canvas>
    <div id="hud"><span id="status">booting</span><span id="detail">Loading software into the full RPCS3 runtime…</span></div>
    <button id="export-trace" type="button" title="Copy the recorded input trace as JSON">trace</button>
    <section class="controls" aria-label="Touch controls">
      <div class="dpad">
        <button data-control="up" aria-label="Up">▲</button>
        <button data-control="left" aria-label="Left">◀</button>
        <button data-control="right" aria-label="Right">▶</button>
        <button data-control="down" aria-label="Down">▼</button>
      </div>
      <button class="start" data-control="start">START</button>
      <div class="faces">
        <button data-control="triangle" aria-label="Triangle">△</button>
        <button data-control="square" aria-label="Square">□</button>
        <button data-control="circle" aria-label="Circle">○</button>
        <button data-control="cross" aria-label="Cross">×</button>
      </div>
    </section>
    <script type="module" src="./play-runtime.mjs"></script>
  </body>
</html>
